services:
  - type: web
    name: stockflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-lock.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
